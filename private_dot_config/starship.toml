# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$kubernetes\
$direnv\
$env_var\
$crystal\
$custom\
$sudo\
$fill\
$cmd_duration $time\
$line_break\
$jobs\
$battery\
$status\
$os\
$container\
$shell\
$character"""

# right_format = ""
[fill]
symbol = " "

[username]
disabled = true

[hostname]
disabled = true

[kubernetes]
disabled = false
format = '[$symbol($context)(\($namespace\))]($style)'
symbol = '󱃾 '
style = 'green'

[aws]
format = '[$symbol($profile )($region )($duration )]($style)'
symbol = '󰸏 '

[gcloud]
format = '[($symbol)($domain )($project)]($style)'
symbol = '󱇶 '
style = 'blue'

[terraform]
symbol = ' '

[python]
disabled = true

[character]
format = "$symbol "
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'

[cmd_duration]
format = "[$duration](dimmed white)"

[time]
disabled = false
format = '[$time]($style)'
time_format = "%R"
style = 'yellow'
